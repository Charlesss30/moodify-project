org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Pub cache is on C: while this project is on D:; avoid Kotlin cross-drive incremental paths.
kotlin.incremental=false

# Limit concurrent build work on the 16 GB development machine.
org.gradle.workers.max=2

# Release idle build memory during emulator/audio testing (2 minutes).
org.gradle.daemon.idletimeout=120000
